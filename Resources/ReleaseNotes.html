<h2>多一点键鼠活动</h2>
<ul>
  <li>键鼠活动新增「鼠标移动」和「滚动量」，沿用简洁的两列布局。</li>
  <li>支持鼠标与触控板，随今日、7 天、30 天范围切换。</li>
  <li>移动距离按显示器尺寸估算光标在屏幕上的行程；滚动量累计系统横纵轴的滚动像素，包含惯性。</li>
  <li>事件仅在内存合并为数值，最多每秒提交一次，沿用延迟写盘与界面刷新，不保存轨迹或滚动内容。</li>
  <li>兼容已有统计，新指标从升级后开始记录；重置统计时一并清空。</li>
</ul>
<p>鼠标移动距离是屏幕指针行程估算，不是鼠标在桌面上的物理距离。升级不会自动清除现有统计或更改权限设置。</p>
